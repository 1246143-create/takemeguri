<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="竹めぐり ～切って、食べて、作って、買って、竹林をめぐらせる～ 阿南市の放置竹林問題に取り組む GCON2026 発表用プロトタイプ">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>竹めぐり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap">
<style>
/* Layout: mobile-first app shell — sticky header + bottom tab bar on phones, header nav on desktop; content column max 1080px */
:root{
  --bg:#F3F7EF; --surface:#FFFFFF; --surface-2:#E6EFDD; --surface-3:#F8F3E3;
  --ink:#1D2A21; --ink-soft:#56685B; --line:#D3DFCB;
  --bamboo:#2E7A4A; --bamboo-deep:#1D5634; --shoot:#B5D145; --straw:#E8D8A2;
  --amber:#D47B22; --on-primary:#FFFFFF; --on-amber:#FFFFFF; --on-shoot:#1D2A21;
  --g1:#2E6E45; --g2:#4C9A62; --g3:#8DC07A; --leaf:#5FAE5E; --node:#1E5434;
  --s-winter:#5F8FBF; --s-spring:#E08AA0; --s-dried:#B8913E; --s-allyear:#5E8A63;
  --art-char:#2B2B29; --art-char-hi:#55554F; --art-wood:#C9A56A; --art-wood-dk:#9C7A43; --art-straw:#E9D59B;
  --art-amber:#E2A13F; --art-glass:#DCEBE6; --art-bg-1:#E9F1E0; --art-bg-2:#F6EDD6; --art-bg-3:#E4ECF2; --art-bg-4:#F3E3D3;
  --shadow:0 10px 30px -12px rgba(29,86,52,.28);
  --font-display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --font-num:"Outfit","Zen Kaku Gothic New",system-ui,sans-serif;
  --r-lg:24px; --r-md:16px; --r-sm:10px;
  --header-h:64px; --tab-h:66px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111A14; --surface:#18231C; --surface-2:#203026; --surface-3:#262A1E;
  --ink:#E5EEE2; --ink-soft:#A3B5A7; --line:#2F4235;
  --bamboo:#5EBD80; --bamboo-deep:#9AD9AE; --shoot:#C3DC5C; --straw:#5D5434;
  --amber:#EE9A45; --on-primary:#0D1A11; --on-amber:#1E1305; --on-shoot:#13200F;
  --g1:#2C6A43; --g2:#3E8956; --g3:#5FA266; --leaf:#4E9B53; --node:#9AD9AE;
  --s-winter:#86B2DE; --s-spring:#EFA3B6; --s-dried:#D8B35E; --s-allyear:#86B28B;
  --art-char:#0C0C0B; --art-char-hi:#5B5B55; --art-wood:#B99459; --art-wood-dk:#8A6936; --art-straw:#CDB777;
  --art-amber:#D9973A; --art-glass:#36504A; --art-bg-1:#22352A; --art-bg-2:#36301F; --art-bg-3:#223140; --art-bg-4:#3A2C22;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111A14; --surface:#18231C; --surface-2:#203026; --surface-3:#262A1E;
  --ink:#E5EEE2; --ink-soft:#A3B5A7; --line:#2F4235;
  --bamboo:#5EBD80; --bamboo-deep:#9AD9AE; --shoot:#C3DC5C; --straw:#5D5434;
  --amber:#EE9A45; --on-primary:#0D1A11; --on-amber:#1E1305; --on-shoot:#13200F;
  --g1:#2C6A43; --g2:#3E8956; --g3:#5FA266; --leaf:#4E9B53; --node:#9AD9AE;
  --s-winter:#86B2DE; --s-spring:#EFA3B6; --s-dried:#D8B35E; --s-allyear:#86B28B;
  --art-char:#0C0C0B; --art-char-hi:#5B5B55; --art-wood:#B99459; --art-wood-dk:#8A6936; --art-straw:#CDB777;
  --art-amber:#D9973A; --art-glass:#36504A; --art-bg-1:#22352A; --art-bg-2:#36301F; --art-bg-3:#223140; --art-bg-4:#3A2C22;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.3;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--bamboo)}
:focus-visible{outline:3px solid var(--shoot);outline-offset:2px;border-radius:8px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{min-height:100vh;display:flex;flex-direction:column}
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.header-in{max-width:1120px;margin:0 auto;padding-inline:16px;height:var(--header-h);display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;padding:4px 0}
.logo b{font-family:var(--font-display);font-weight:900;font-size:22px;letter-spacing:.06em}
.logo small{display:block;font-size:10px;color:var(--ink-soft);letter-spacing:.12em;line-height:1;font-family:var(--font-num)}
.nav{margin-left:auto;display:none;gap:4px}
.nav button{background:none;border:0;padding:10px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink-soft);display:flex;gap:6px;align-items:center}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button.on{background:var(--surface-2);color:var(--bamboo-deep)}
.main{flex:1;padding-bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink-soft);cursor:pointer}
.tabbar button.on{color:var(--bamboo)}
.tabbar button.on .tab-ico{background:var(--surface-2)}
.tab-ico{width:44px;height:28px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
@media (min-width:900px){
  .nav{display:flex}
  .tabbar{display:none}
  .main{padding-bottom:48px}
  .header-in{padding-inline:24px}
  .wrap{padding-inline:24px}
}
.footer{border-top:1px solid var(--line);margin-top:56px;padding-block:28px;color:var(--ink-soft);font-size:13px}
.footer .wrap{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:12px 24px;border-radius:999px;border:2px solid transparent;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .2s,background .2s;font-family:var(--font-body);line-height:1.3;text-align:center}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--bamboo);color:var(--on-primary);box-shadow:var(--shadow)}
.btn-primary:hover{background:var(--bamboo-deep)}
:root:not([data-theme="light"]) .btn-primary:hover{filter:brightness(1.05)}
.btn-amber{background:var(--amber);color:var(--on-amber)}
.btn-amber:hover{filter:brightness(1.06)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--bamboo);color:var(--bamboo-deep)}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-sm{min-height:42px;padding:8px 16px;font-size:14px}
.link-btn{background:none;border:0;color:var(--bamboo);font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:4px;padding:6px 0;font-size:15px}
.link-btn:hover{text-decoration:underline}

/* ---------- common ---------- */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--bamboo);display:inline-flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:18px;height:6px;border-radius:3px;background:var(--shoot);box-shadow:0 0 0 1.5px var(--bamboo) inset}
.section{margin-top:56px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(22px,4.4vw,30px);font-weight:900;margin-top:6px}
.sec-head p{color:var(--ink-soft);margin-top:6px;font-size:15px}
.page-head{padding-block:28px 8px}
.page-head h1{font-size:clamp(26px,5.6vw,40px);font-weight:900;margin-top:8px}
.page-head p{color:var(--ink-soft);margin-top:10px;max-width:40em}
.back{background:none;border:0;display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-weight:700;cursor:pointer;padding:8px 0;font-size:14px;margin-top:12px}
.back:hover{color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.season{color:var(--on-primary);background:var(--c)}
.grid{display:grid;gap:16px}
@media (min-width:640px){.g2{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
@media (min-width:640px) and (max-width:899px){.g3,.g4{grid-template-columns:repeat(2,1fr)}}
.node-rule{height:10px;border-radius:5px;background:var(--surface-2);position:relative;margin-block:8px}
.node-rule::after{content:"";position:absolute;inset:3px 0;border-top:1.5px solid var(--line);border-bottom:1.5px solid var(--line)}
.muted{color:var(--ink-soft)}
.fade-in{animation:fadeUp .45s ease both}
@keyframes fadeUp{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- home ---------- */
.hero{position:relative;overflow:hidden;border-radius:0 0 36px 36px;background:linear-gradient(170deg,var(--surface-2),var(--bg) 75%);border-bottom:1px solid var(--line)}
.hero-in{position:relative;z-index:2;display:grid;gap:28px;padding-block:36px 40px}
.hero-grove{position:absolute;right:-60px;bottom:0;width:min(640px,120%);height:100%;z-index:1;opacity:.35;pointer-events:none}
.hero h1{font-size:clamp(56px,14vw,104px);font-weight:900;letter-spacing:.08em;line-height:1.05;margin-top:14px;color:var(--bamboo-deep)}
.hero h1 ruby rt{font-size:13px;letter-spacing:.4em;color:var(--ink-soft);font-weight:700}
.tagline{font-family:var(--font-display);font-weight:700;font-size:clamp(16px,3.6vw,21px);margin-top:14px;line-height:1.7}
.tagline .v{display:inline-block;padding:0 2px;background:linear-gradient(transparent 62%,color-mix(in srgb,var(--shoot) 70%,transparent) 62%)}
.hero .lead{margin-top:16px;color:var(--ink-soft);max-width:30em;font-size:15.5px}
.hero-ctas{display:grid;gap:12px;margin-top:26px;max-width:420px}
.hero-ctas .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero-ctas .btn-ghost{padding-inline:12px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-self:end}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 12px}
.stat b{display:block;font-family:var(--font-num);font-size:clamp(24px,5vw,32px);font-weight:700;color:var(--bamboo-deep);line-height:1.1}
.stat b small{font-size:13px;font-family:var(--font-body);margin-left:2px}
.stat span{font-size:12px;color:var(--ink-soft);line-height:1.4;display:block;margin-top:4px}
@media (min-width:900px){
  .hero-in{grid-template-columns:1.25fr .9fr;padding-block:64px 56px;align-items:end}
  .hero-grove{opacity:1;right:-20px;width:44%}
  .hero-stats{grid-template-columns:1fr;max-width:260px;justify-self:end;margin-right:8%}
  .stat{background:color-mix(in srgb,var(--surface) 92%,transparent)}
}
.verbs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:900px){.verbs{grid-template-columns:repeat(4,1fr);gap:16px}}
.verb{position:relative;text-align:left;cursor:pointer;padding:18px 16px 16px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px;transition:transform .2s,border-color .2s}
.verb:hover{transform:translateY(-3px);border-color:var(--c)}
.verb .vi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c)}
.verb h3{font-size:22px;font-weight:900}
.verb h3 small{font-size:13px;color:var(--ink-soft);font-weight:700;margin-left:6px;font-family:var(--font-body)}
.verb p{font-size:13.5px;color:var(--ink-soft);line-height:1.6}
.verb .step{position:absolute;top:16px;right:16px;font-family:var(--font-num);font-size:12px;font-weight:700;color:var(--ink-soft)}
.loop-band{display:grid;gap:24px;align-items:center;padding:28px 20px;border-radius:32px;background:var(--surface-3);border:1px solid var(--line)}
@media (min-width:900px){.loop-band{grid-template-columns:1fr 1fr;padding:40px 48px}}
.loop-band h2{font-size:clamp(22px,4.6vw,32px);font-weight:900}
.loop-band p{color:var(--ink-soft);margin-top:10px}
.roles-cloud{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}

/* ---------- events ---------- */
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-top:16px;scrollbar-width:none}
.filters button{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-weight:700;cursor:pointer;font-size:14px}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ev{display:flex;flex-direction:column;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:left;padding:0;font:inherit}
.ev:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ev-art{position:relative;aspect-ratio:16/8;max-width:100%;background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.ev-art svg{width:100%;height:100%;display:block}
.ev-date{position:absolute;left:14px;bottom:-22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 12px;text-align:center;min-width:70px;box-shadow:var(--shadow)}
.ev-date .m{font-size:11px;color:var(--ink-soft);font-weight:700;display:block;line-height:1.2}
.ev-date .d{font-family:var(--font-num);font-size:24px;font-weight:700;line-height:1.1}
.ev-date .w{font-size:11px;color:var(--ink-soft)}
.ev-badges{position:absolute;top:12px;left:12px;display:flex;gap:6px}
.ev-body{padding:32px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.ev-body h3{font-size:19px;font-weight:900}
.ev-catch{font-size:14px;color:var(--ink-soft);line-height:1.6}
.facts{display:grid;gap:6px;font-size:14px;margin-top:2px}
.fact{display:flex;gap:8px;align-items:flex-start;color:var(--ink)}
.fact svg{flex:none;margin-top:3px;color:var(--bamboo)}
.seat{margin-top:auto;padding-top:8px}
.seat-bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.seat-bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.seat-txt{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-soft);margin-top:6px}
.seat-txt b{color:var(--ink)}
.featured-tag{background:var(--shoot);color:var(--on-shoot)}

/* ---------- event detail ---------- */
.detail{display:grid;gap:24px;margin-top:8px}
@media (min-width:900px){.detail{grid-template-columns:1.4fr 1fr;align-items:start}}
.detail-art{border-radius:var(--r-lg);overflow:hidden;aspect-ratio:16/9;max-width:100%;background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.detail-art svg{width:100%;height:100%;display:block}
.info-table{display:grid;gap:0;padding:6px 20px}
.info-row{display:grid;grid-template-columns:88px 1fr;gap:12px;padding:14px 0;border-bottom:1px dashed var(--line);font-size:15px}
.info-row:last-child{border-bottom:0}
.info-row dt{color:var(--ink-soft);font-weight:700;display:flex;gap:6px;align-items:center;font-size:14px}
.info-row dd{margin:0;min-width:0}
.info-row dd small{display:block;color:var(--ink-soft);font-size:13px;line-height:1.6}
.aside-sticky{position:sticky;top:calc(var(--header-h) + 16px);display:grid;gap:16px}
.timeline-s{display:grid;gap:0;margin-top:12px}
.ts{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:10px 0;border-left:0}
.ts .t{font-family:var(--font-num);font-weight:600;color:var(--bamboo-deep);font-size:15px}
.cta-bar{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:25;padding:12px 16px;background:color-mix(in srgb,var(--surface) 94%,transparent);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.cta-bar .price{font-family:var(--font-num);font-weight:700;font-size:20px;white-space:nowrap}
.cta-bar .price small{display:block;font-family:var(--font-body);font-size:11px;color:var(--ink-soft);font-weight:500}
.cta-bar .btn{flex:1}
@media (min-width:900px){.cta-bar{display:none}}
.has-cta .main{padding-bottom:calc(var(--tab-h) + 110px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){.has-cta .main{padding-bottom:48px}}
.prose{display:grid;gap:12px;font-size:15.5px}
.box{padding:22px 20px}
.box h3{font-size:18px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.mini-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
.mini-flow span{background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700}
.mini-flow i{color:var(--ink-soft);font-style:normal}

/* ---------- apply ---------- */
.steps{display:flex;gap:6px;margin:20px 0 24px;max-width:520px}
.steps .s{flex:1;display:grid;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.steps .s i{display:block;height:6px;border-radius:3px;background:var(--line)}
.steps .s.on{color:var(--bamboo-deep)}
.steps .s.on i{background:var(--bamboo)}
.notice{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:var(--r-md);background:color-mix(in srgb,var(--shoot) 22%,var(--surface));border:1.5px solid color-mix(in srgb,var(--shoot) 70%,var(--line))}
.notice .ni{flex:none;width:44px;height:44px;border-radius:50%;background:var(--shoot);color:var(--on-shoot);display:grid;place-items:center}
.notice b{font-family:var(--font-display);font-size:17px;display:block}
.notice p{font-size:13.5px;color:var(--ink-soft);line-height:1.6}
.roles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
@media (min-width:900px){.roles{grid-template-columns:repeat(4,1fr)}}
.role{position:relative;text-align:left;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-md);padding:16px 14px 14px;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,background .15s,transform .15s}
.role:hover{border-color:var(--g3)}
.role.on{border-color:var(--bamboo);background:color-mix(in srgb,var(--bamboo) 9%,var(--surface))}
.role .ri{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--bamboo-deep)}
.role.on .ri{background:var(--bamboo);color:var(--on-primary)}
.role b{font-size:16px;font-family:var(--font-display)}
.role p{font-size:12.5px;color:var(--ink-soft);line-height:1.55}
.role .tick{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface)}

function parseHash() {
  const h = (window.location.hash || "").replace(/^#/, "");
  if (!h) return { page: "home" };
  const prefixes = ["event", "apply", "product"];
  for (const p of prefixes) {

  }
  return { page: h };
}

/* 決定的な疑似乱数（イラストを毎回同じ形にする） */
function rng(seed) { let s = seed; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }

/* 竹の一本 */
function Stalk({ x, w, h, top = 0, tone, seg = 52, leaves = true, r }) {
  const nodes = [];
  for (let y = top + seg * (0.5 + r() * 0.6); y < h - 10; y += seg + r() * 14) nodes.push(y);
  return (
    <g>
      <rect x={x} y={top} width={w} height={h - top} rx={w / 2.4} style={{ fill: tone }} />
      <rect x={x + w * 0.18} y={top} width={w * 0.16} height={h - top} style={{ fill: "var(--g3)", opacity: .35 }} />
      {nodes.map((y, i) => (
        <rect key={i} x={x - 1.5} y={y} width={w + 3} height={3.2} rx={1.6} style={{ fill: "var(--node)", opacity: .55 }} />
      ))}
      {leaves && nodes.filter((_, i) => i % 2 === 1 && i < 4).map((y, i) => {
        const dir = (i + Math.round(x)) % 2 ? 1 : -1;
        return (
          <g key={"l" + i} transform={`translate(${x + w / 2} ${y}) scale(${dir} 1)`}>
            {[-28, -8, 14].map((a, j) => (
              <path key={j} d="M0 0 Q 22 -7 50 0 Q 22 7 0 0Z" transform={`rotate(${a + r() * 10})`} style={{ fill: "var(--leaf)", opacity: .9 }} />
            ))}
          </g>
        );
      })}
    </g>
  );
}

function Grove({ seed = 7, count = 9, w = 600, h = 460, className, style }) {
  const r = rng(seed);
  const tones = ["var(--g1)", "var(--g2)", "var(--g3)"];
  const stalks = Array.from({ length: count }, (_, i) => ({
    x: (w / count) * i + r() * 30, sw: 12 + r() * 14, tone: tones[Math.floor(r() * 3)], top: r() * 40 - 20, seg: 46 + r() * 22,
  }));
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="xMidYMax slice" className={className} style={style} aria-hidden="true">
      {stalks.map((s, i) => <Stalk key={i} x={s.x} w={s.sw} h={h} top={s.top} tone={s.tone} seg={s.seg} r={r} />)}
    </svg>
  );
}

/* 循環図（中心機能） */
function CycleDiagram({ active, onSelect, size = 400 }) {
  const n = CYCLE.length, cx = 200, cy = 200, R = 140;
  const pos = (i) => {
    const a = (-90 + (360 / n) * i) * Math.PI / 180;
    return [cx + R * Math.cos(a), cy + R * Math.sin(a), a];
  };
  const reduce = typeof window !== "undefined" && window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  return (
    <svg className="cycle-svg" viewBox="0 0 400 400" role="img" aria-label="竹めぐりの循環図" style={{ maxWidth: size }}>
      <circle cx={cx} cy={cy} r={R} style={{ fill: "none", stroke: "var(--surface-2)", strokeWidth: 22 }} />
      <circle cx={cx} cy={cy} r={R} style={{ fill: "none", stroke: "var(--g3)", strokeWidth: 2, strokeDasharray: "2 8", strokeLinecap: "round" }} />
      {CYCLE.map((_, i) => {
        const a = (-90 + (360 / n) * (i + 0.5));
        const rad = a * Math.PI / 180;
        const x = cx + R * Math.cos(rad), y = cy + R * Math.sin(rad);
        return <path key={"a" + i} d="M-6 -7 L5 0 L-6 7" transform={`translate(${x} ${y}) rotate(${a + 90})`}
          style={{ fill: "none", stroke: "var(--bamboo)", strokeWidth: 3, strokeLinecap: "round", strokeLinejoin: "round" }} />;
      })}
      {!reduce && (
        <circle r="7" style={{ fill: "var(--amber)" }}>
          <animateMotion dur="14s" repeatCount="indefinite" path={`M ${cx} ${cy - R} A ${R} ${R} 0 1 1 ${cx - 0.01} ${cy - R}`} />
        </circle>
      )}
      <g>
        <circle cx={cx} cy={cy} r="74" style={{ fill: "var(--surface)", stroke: "var(--line)", strokeWidth: 1.5 }} />
        <text x={cx} y={cy - 8} textAnchor="middle" style={{ fill: "var(--bamboo-deep)", fontFamily: "var(--font-display)", fontWeight: 900, fontSize: 26 }}>竹めぐり</text>
        <text x={cx} y={cy + 18} textAnchor="middle" style={{ fill: "var(--ink-soft)", fontSize: 11.5, fontWeight: 700 }}>切る人・使う人・買う人で</text>
        <text x={cx} y={cy + 35} textAnchor="middle" style={{ fill: "var(--ink-soft)", fontSize: 11.5, fontWeight: 700 }}>竹林をめぐらせる</text>
      </g>
      {CYCLE.map((s, i) => {
        const [x, y] = pos(i);
        const on = i === active;
        const lines = s.short.split("\n");
        return (
          <g key={i} className="cnode" onClick={() => onSelect(i)} role="button" tabIndex="0" aria-label={`${i + 1}. ${s.title}`}
             onKeyDown={(e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onSelect(i); } }}>
            <circle cx={x} cy={y} r={on ? 38 : 34} style={{ fill: on ? "var(--bamboo)" : "var(--surface)", stroke: on ? "var(--bamboo)" : "var(--g3)", strokeWidth: 2.5 }} />
            <text x={x} y={y - 15 - (lines.length - 1) * 6} textAnchor="middle" style={{ fill: on ? "var(--on-primary)" : "var(--ink-soft)", fontFamily: "var(--font-num)", fontSize: 11, fontWeight: 700 }}>{i + 1}</text>
            {lines.map((l, j) => (
              <text key={j} x={x} y={y + 4 + j * 15 - (lines.length - 1) * 6} textAnchor="middle"
                style={{ fill: on ? "var(--on-primary)" : "var(--ink)", fontSize: 13.5 }}>{l}</text>
            ))}
          </g>
        );
      })}
    </svg>
  );
}

function CycleMini() {
  const [a, setA] = useState(0);
  useEffect(() => {
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    const t = setInterval(() => setA((x) => (x + 1) % CYCLE.length), 2200);
    return () => clearInterval(t);
  }, []);
  return <CycleDiagram active={a} onSelect={setA} size={380} />;
}

/* =====================================================================
   6. APP ROOT
   ===================================================================== */

function App() {
  const [route, setRoute] = useState(parseHash());
  const [registration, setRegistration] = useState(null);
  const [purchaseCount, setPurchaseCount] = useState(0);

  useEffect(() => {
    const onHash = () => { setRoute(parseHash()); window.scrollTo({ top: 0 }); };
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);

  const go = (to) => {
    if (("#" + to) === window.location.hash || (to === "home" && !window.location.hash)) { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    window.location.hash = to;
  };
  const addPurchase = (n) => setPurchaseCount((c) => c + 1);

  const pages = {
    home: <HomePage />,
    events: <EventsPage />,
    event: <EventDetailPage id={route.id} />,
    apply: <ApplyPage id={route.id} key={route.id} />,
    done: <DonePage />,
    mybamboo: <MyBambooPage />,
    cycle: <CyclePage />,
    shop: <ShopPage />,
    product: <ProductDetailPage id={route.id} key={route.id} />,
    about: <AboutPage />,
  };
  const hasCta = route.page === "event";

  useEffect(() => { document.body.classList.toggle("has-cta", hasCta); }, [hasCta]);

  return (
    <AppCtx.Provider value={{ route, go, registration, setRegistration, purchaseCount, addPurchase }}>
      <div className="app">
        <Header />
        <main className="main">
          {pages[route.page] || <NotFound />}
          <Footer />
        </main>
        <TabBar />
      </div>
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
